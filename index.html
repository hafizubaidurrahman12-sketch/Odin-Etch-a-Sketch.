<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <script src="sketch.js" defer></script>
</head>
<body>
  <h1>Etch a Sketch</h1>
  <h2>Draw anything</h2>
  <div class="container"></div>
  <div class="reset">Reset Canvas</div>
  <h3>Pick any color</h3>
  <div class="color">
      <div class="red"></div>
      <div class="blue"></div>
      <div class="black"></div>
      <div class="green"></div>
  </div>
  <h4>Grid Size</h4>
  <div class="grid-size">
      <div class="small">16×16</div>
      <div class="medium">32×32</div>
      <div class="large">48×48</div>
      <div class="xl">64×64</div>
  </div>  
</body>
</html>
